name: EBANX Vocabulary
description: >-
  Operational and capability vocabulary for the EBANX payments platform,
  covering pay-in (Direct API, Payment Page, Payment Link), payout, FX, card
  tokenization, payment notifications, and Latin American local payment
  methods and country-specific tax id requirements.
version: '0.1'

domains:
  - id: pay-in
    name: Pay-in
    description: Accepting payments from customers across EBANX markets.
    concepts:
      - Payment
      - DirectPayment
      - PaymentPage
      - PaymentLink
      - DropIn
      - Installment
      - 3DS
      - CardBin
      - InstallmentsPlan
      - Refund
      - Chargeback
      - MedPix
      - PixAutomatico
  - id: payout
    name: Payout
    description: Sending money to bank accounts and e-wallets in EBANX markets.
    concepts:
      - Payout
      - LocalPayout
      - CrossBorderPayout
      - MassPayout
      - Payee
      - PayoutBalance
      - PayoutSimulation
      - AccountVerification
  - id: fx
    name: Foreign Exchange
    description: Currency conversion between merchant pricing currency and local market currencies.
    concepts:
      - ExchangeRate
      - FxToken
      - CurrencyPair
  - id: tokenization
    name: Card Tokenization
    description: Storing card data on EBANX and reusing tokens for repeat charges.
    concepts:
      - CardToken
      - TokenCVV
  - id: notifications
    name: Payment Notifications
    description: Webhooks delivered to merchant endpoints on payment state change.
    concepts:
      - PaymentNotification
      - RefundNotification
      - ChargebackNotification
      - MedPixNotification

paymentMethods:
  cards:
    - visa
    - mastercard
    - amex
    - hipercard
    - elo
    - diners
    - discover
    - aura
  bankTransfer:
    - pix
    - boleto
    - spei
    - pse
    - safetypay
    - sencillito
    - servipag
  cashVoucher:
    - oxxo
    - efecty
    - baloto
    - pagoefectivo
    - rapipago
    - pagofacil
    - oxxo-pay
    - paycash
  eWallets:
    - mercadopago
    - picpay
    - nupay
    - nequi
    - rappipay
    - daviplata
  recurring:
    - pix-automatico
    - nupay
    - mercadopago

