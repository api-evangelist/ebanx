name: Pay-in Direct API
description: >-
  Accept a payment directly through the EBANX Pay-in Direct API for any
  supported local payment method in Latin America and other rising markets.
version: '1.0'
provider: ebanx
api: ebanx-pay-in-direct-api
operations:
  - id: createDirectPayment
    method: POST
    path: /ws/direct
    summary: Create Direct Payment
  - id: capturePayment
    method: POST
    path: /ws/capture
    summary: Capture Payment
  - id: queryPayment
    method: POST
    path: /ws/query
    summary: Query Payment
  - id: cancelPayment
    method: POST
    path: /ws/cancel
    summary: Cancel Payment
  - id: refundPayment
    method: POST
    path: /ws/refund
    summary: Refund Payment
  - id: listInstallmentsPlan
    method: POST
    path: /ws/instalmentsPlan
    summary: List Installments Plan
  - id: lookupCardBin
    method: POST
    path: /ws/cardbin
    summary: Lookup Card BIN
inputs:
  - name: integration_key
    secret: true
    required: true
  - name: country
    required: true
  - name: payment_type_code
    required: true
  - name: amount_total
    required: true
  - name: currency_code
    required: true
outputs:
  - hash
  - status
  - payment_type_code
governance:
  pii: true
  pci: true
  region: LATAM
