name: Foreign Exchange
description: >-
  Quote current FX rates between a merchant pricing currency and EBANX market
  currencies, and mint short-lived FX tokens that lock a rate for a future
  Direct Payment.
version: '1.0'
provider: ebanx
api: ebanx-fx-api
operations:
  - id: getExchangeRate
    method: POST
    path: /ws/exchange
    summary: Get Exchange Rate
  - id: getFxToken
    method: POST
    path: /ws/fxtoken/get
    summary: Get FX Token
inputs:
  - name: integration_key
    secret: true
    required: true
  - name: currency_code
    required: true
  - name: country
    required: true
outputs:
  - rate
  - fx_token
governance:
  region: LATAM
