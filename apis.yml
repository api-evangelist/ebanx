  - url: json-schema/ebanx-card-token-schema.json
    type: JSONSchema
  description: >-
    Tokenize cards on EBANX so PAN never touches merchant servers, and refresh CVVs on stored tokens before
    high-risk reuse. Reusable tokens power one-click checkout, subscriptions, and stored-card flows.
- aid: ebanx:ebanx-fx-api
  name: EBANX FX API
  tags:
  - Foreign Exchange
  - FX
  - Cross-Border
  humanURL: https://docs.ebanx.com/api/
  baseURL: https://api.ebanxpay.com
  properties:
  - url: https://docs.ebanx.com/api/
    type: APIReference
  - url: openapi/ebanx-fx-api-openapi.yml
    type: OpenAPI
  description: >-
    Quote current FX rates between a merchant pricing currency (typically USD or EUR) and EBANX market
    currencies, and mint a short-lived FX token to lock a rate so a quoted price is honored when the underlying
    Direct Payment is captured.
- aid: ebanx:ebanx-notifications
  name: EBANX Payment Notifications
  tags:
  - Webhook
  - Notification
