    type: Documentation
  - url: asyncapi/ebanx-notifications-asyncapi.yml
    type: AsyncAPI
  - url: examples/ebanx-payment-notification-example.json
    type: Examples
  description: >-
    Signed HTTP POST callbacks delivered to a merchant-configured Notification URL whenever a payment,
    refund, chargeback, or Pix MED return request changes state. Each callback carries the EBANX hash
    so the merchant can re-query the Direct API for authoritative payment state.
